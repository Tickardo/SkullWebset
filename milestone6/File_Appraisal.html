    <div id="details">
     <div class="form-box">
  <h2>Request an Appraisal</h2>

  <form>
    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Property Address</label>
    <input type="text" name="address" required>

    <label>Property Type</label>
    <select name="property">
      <option>Single Family - $375</option>
      <option>Condo - $450</option>
      <option>Luxury - $700</option>
      <option>Complex - $800</option>
      <option>Multi Unit - $800</option>
      <option>Rental Survey - $200</option>
    </select>

    <label>Additional Notes</label>
    <textarea name="notes" rows="4"></textarea>

    <button type="submit">Submit Appraisal Request</button>
  </form>
